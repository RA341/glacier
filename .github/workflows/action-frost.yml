name: Frost Build

on:
  workflow_call:
    inputs:
      version_tag:
        description: 'The primary version identifier (e.g., v1.2.3, canary, dev)'
        required: true
        type: string

jobs:
  build-architectures:
    strategy:
      matrix:
        include:
          - platform: "linux"
            machine: ubuntu-latest
            output_path: .build/frost/linux
            zip_name: frost-linux.zip

          - platform: "windows"
            machine: windows-latest
            output_path: .build/frost/windows
            zip_name: frost-windows.zip

    name: Build frost (${{ matrix.platform }})
    runs-on: ${{ matrix.machine }}
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: 'true'
          cache-dependency-path: core/go.sum

      - name: Install Task
        uses: go-task/setup-task@v1


      - name: setup coreutils
        uses: MinoruSekine/setup-scoop@v4.0.2
        if: runner.os == 'Windows'
        with:
          buckets: main
          apps: uutils-coreutils

      - name: Setup MSYS2 for Windows CGO
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Build frost
        run: |
          task init
          task frost

      - name: Zip Artifacts
        if: runner.os == 'Linux'
        run: zip -r ${{ matrix.zip_name }} ${{ matrix.output_path }}

      - name: Zip Artifacts
        if: runner.os == 'Windows'
        run: Compress-Archive -Path ${{ matrix.output_path }} -DestinationPath ${{ matrix.zip_name }}

      - name: Upload to Canary Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: canary
          prerelease: true
          files: ${{ matrix.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}