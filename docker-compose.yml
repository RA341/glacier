name: glacier-dev
services:
  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - pocket-id-net
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: glacier
    ports:
      - "5432:5432"
    volumes:
      - .build/postgres_data:/var/lib/postgresql/data

  pocket:
    image: ghcr.io/pocket-id/pocket-id:latest
    environment:
      - ENCRYPTION_KEY=ZLEAiNYTFgxFgSomYSsWGC1xdH1U26Z6sScFHM8gcoM=
      - APP_URL=https://auth.localhost
      - TRUST_PROXY=true
    ports:
      - "1411:1411"
    volumes:
      - ./.build/pocket_id:/app/backend/data
    networks:
      - pocket-id-net
    depends_on:
      - caddy
    restart: unless-stopped

  yt:
    container_name: yt-relay
    image: ghcr.io/ra341/ytrelay:latest
#    environment:
#      CACHE_DURATION_MINUTES: 60
#      API_KEY: someSecretKey
    ports:
      - "3002:3000"

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    environment:
      - PUID=1000
      - PGID=1000
      - USER=admin
      - PASS=admin
    volumes:
      - .build/transmission/config:/config
      - /home/ra341/Dev/Go/glacier/.build/dev/incomplete:/home/ra341/Dev/Go/glacier/.build/dev/incomplete
    ports:
      - "9091:9091"
    depends_on:
      - caddy

  qbit:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - .build/qbittorrent/appdata:/config
      - .build/qbittorrent/downloads:/downloads
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - caddy
volumes:
  caddy_data:
  caddy_config:
  pocket_id_data:

networks:
  pocket-id-net:
